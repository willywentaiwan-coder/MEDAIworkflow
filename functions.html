erii."},sk:{language:"Jazyk",notice:"Podrobný obsah zostáva v angličtine do kontroly prekladu."},sl:{language:"Jezik",notice:"Podrobna vsebina ostaja v angleščini do pregleda prevoda."},es:{language:"Idioma",notice:"El contenido detallado permanece en inglés hasta completar la revisión de la traducción."},sv:{language:"Språk",notice:"Det detaljerade innehållet förblir på engelska tills översättningen har granskats."},ja:{language:"言語",notice:"詳細内容は翻訳レビューが完了するまで英語の標準版を表示します。"},ko:{language:"언어",notice:"상세 내용은 번역 검토가 완료될 때까지 영어 표준본으로 표시됩니다."},th:{language:"ภาษา",notice:"เนื้อหาโดยละเอียดยังคงเป็นภาษาอังกฤษจนกว่าจะทบทวนคำแปลเสร็จสิ้น"}
    };
    Object.entries(languageShell).forEach(([locale,shell])=>{const fallback=JSON.parse(JSON.stringify(data.en));fallback.language=shell.language;fallback.note=shell.notice+" "+data.en.note;fallback.contentLang="en";data[locale]=fallback;});
    const hero=document.getElementById("hero"),index=document.getElementById("function-index"),main=document.getElementById("content"),footer=document.getElementById("footer"),select=document.getElementById("language"),label=document.getElementById("language-label");
    const toolType=(t,type)=>type==="Workflow"?t.typeWorkflow:type==="Framework"?t.typeFramework:type==="Feedback"?t.typeFeedback:type==="Practice"?t.typePractice:type==="Data workflow"?t.typeData:type==="Manual"?t.typeManual:t.typePrompt;
    function render(locale){const t=data[locale]||data.en;document.documentElement.lang=t.contentLang||locale;document.title=`${t.directory}｜Medical AI Workflow`;label.textContent=t.language;select.value=locale;hero.innerHTML=`<p class="eyebrow">Medical AI information architecture</p><h1>${t.title.replace(t.accent,`<em>${t.accent}</em>`)}</h1><p class="lead">${t.lead}</p><div class="architecture">${t.steps.map((s,i)=>`${i?'<span aria-hidden="true">→</span>':''}<div><b>${s[0]}</b><strong>${s[1]}</strong><small>${s[2]}</small></div>`).join("")}</div>`;index.setAttribute("aria-label",t.directory);index.innerHTML=t.functions.map(f=>`<a href="#${f[0]}">${f[1]}</a>`).join("");main.innerHTML=t.functions.map(f=>`<section class="function" id="${f[0]}"><div class="function-head"><div class="function-code">${f[1].split(" ").map(w=>w[0]).join("").slice(0,3)}</div><div><h2>${f[1]}</h2><p class="mission">${f[2]}</p></div></div><div class="tools">${f[3].map(tool=>`<a class="tool ${tool[3]==="Feedback"?"feedback-tool":""}" href="${tool[1]}"${tool[7]?' download':''}>${tool[4]||tool[5]||tool[6]?`<span class="tool-badges">${tool[4]?`<span class="shared">${t.shared}</span>`:""}${tool[5]?`<span class="published">${t.published}</span>`:""}${tool[6]?`<span class="draft">${t.draft}</span>`:""}</span>`:""}<span class="tool-type">${toolType(t,tool[3])}</span><strong>${tool[0]}</strong><p>${tool[2]}</p><span class="open">${tool[7]?t.download:t.open}</span></a>`).join("")}</div></section>`).join("")+`<section class="rulebook"><h2>${t.ruleTitle}</h2><ol>${t.rules.map(r=>`<li>${r}</li>`).join("")}</ol><div class="badge-legend"><h3>${t.statusTitle}</h3>${t.statusLegend.map(s=>`<p><strong>${s[0]}</strong>${s[1]}</p>`).join("")}</div><p class="translation-note" lang="${locale}">${t.note}</p></section>`;footer.textContent=t.footer;try{localStorage.setItem("medai-language",locale)}catch(_){}document.dispatchEvent(new CustomEvent("medai-language-change",{detail:{locale}}));}
    let initial="zh-Hant";try{const saved=localStorage.getItem("medai-language");if(data[saved])initial=saved}catch(_){}select.addEventListener("change",()=>render(select.value));render(initial);
  })();
