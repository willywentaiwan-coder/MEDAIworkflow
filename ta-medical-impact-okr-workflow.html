    function render(locale){const t=copy[locale]||copy.en,p=tabs[locale]||tabs.en;document.documentElement.lang=t.contentLang||locale;document.title=t.title;meta.content=t.desc;label.textContent=t.language;label.lang=locale;print.textContent=t.print;print.lang=locale;language.value=locale;suite.setAttribute("aria-label",p.label);suite.querySelectorAll("[data-tab]").forEach(a=>a.textContent=p[a.dataset.tab]);app.innerHTML=page(t,locale);document.getElementById("jump").addEventListener("change",e=>document.getElementById(e.target.value).scrollIntoView());try{localStorage.setItem("medai-language",locale)}catch(e){}}
    let initial="en";try{const saved=localStorage.getItem("medai-language");if(copy[saved])initial=saved}catch(e){}language.addEventListener("change",()=>render(language.value));print.addEventListener("click",()=>window.print());render(initial);
  })();
  </script>
</body>
