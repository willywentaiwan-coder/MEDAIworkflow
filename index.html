      "zh-Hant":{title:"AI × Medical Excellence｜運作模式",desc:"Medical Excellence 如何讓 AI 輔助工作在 Medical Affairs 中維持一致、可衡量並持續改善。",ui:{language:"語言",changed:"已切換為繁體中文",print:"列印／存成 PDF",jump:"跳至章節",onpage:"本頁章節",back:"回到頁首",prev:"上一節",next:"下一節",start:"回到開始"},status:"Medical Excellence operating model",nav:["Excellence 角色","五個職能","Excellence workflow","實際案例","衡量與改善"],hero:{a:"AI 加速執行，",b:"Medical Excellence 讓品質可以被複製。",lead:"Medical Excellence 串連人、流程、證據與學習，讓 AI 輔助工作能在不同職能中持續提升科學品質。",rule:"AI 執行任務；Medical Excellence 設計標準、賦能團隊、校準品質並強化學習循環。"},role:{h:"Excellence 的角色，是讓好的工作可以穩定重現",take:"Excellence 不取代各職能的決策，而是建立一套共同系統，協助團隊大規模維持可靠品質。",items:[["定義","建立共同方法、品質標準、範本與預期輸出。"],["賦能","依據真實工作 journey 提供工具、能力與 coaching。"],["校準","比較輸出、對齊判斷並找出反覆出現的品質缺口。"],["改善","把修改、例外與結果轉化為更好的標準與能力。"]]},functions:{h:"Excellence 對每個職能提供不同支持",take:"共同系統保持一致；各職能保留自己的科學判斷與決策。",items:[["MSL","強化 note-to-insight 標準、insight calibration 與 coaching。"],["TA Lead","支持 insight synthesis、優先排序標準與一致的策略發展。"],["Medical Content","標準化 evidence-to-story 結構、可追溯性與 review 品質。"],["Patient Affairs","結構化 patient insights，並連結到可衡量的患者價值。"],["Medical Excellence","負責共同方法、能力建構、衡量指標與跨職能學習。"]]},workflow:{h:"一套 Excellence workflow，讓 AI 輸出轉化為學習",take:"即使專業任務不同，每一條 journey 都使用同一個改善循環。",steps:[["設定成功標準","目的與預期品質"],["標準化輸入","必要欄位與來源結構"],["AI 輔助","結構化、分析或起草"],["專家校準","確認意義與品質"],["學習與改善","更新方法、工具與能力"]]},caseStudy:{h:"案例：從 field conversation 到策略優先事項",take:"各職能負責 Medical 決策；Excellence 改善工作方法並建立學習。",steps:[["MSL 記錄","Field interaction"],["AI 結構化","mVOC 初稿"],["MSL 校準","Signal 與 meaning"],["TA Lead 合成","主題與優先事項"],["TA Lead 決策","Owner 與下一步"]],outcomeLabel:"Excellence 的貢獻",outcome:"整理修正模式，更新 template、prompt、coaching 與 quality criteria，讓下一個循環更好。"},measure:{h:"衡量這套系統是否持續變好",take:"成功不是產生多少 AI output，而是更好的品質、更快的學習與更一致的執行。",items:[["品質","First-pass acceptance、修改模式與可追溯性。"],["效率","Cycle time 與可避免的 rework。"],["一致性","不同團隊與 journey 是否使用相同品質標準。"],["學習","修改如何改善範本、工具、coaching 與 skills。"]],actionTitle:"啟動一個 Excellence pilot",action:"選擇一條高頻 journey，指定一位 function owner 與一位 Medical Excellence partner，記錄 baseline、執行 workflow，並在四週後檢視四項衡量結果。"},footer:"版本 3.0 · 2026-08-24 · Offline single-file HTML · Internal Medical Excellence discussion draft。"},
      ja:{title:"AI × Medical Excellence｜運用モデル",desc:"Medical ExcellenceがAI支援業務を一貫性、測定可能性、継続的改善につなげる方法。",ui:{language:"言語",changed:"日本語に切り替えました",print:"印刷／PDF保存",jump:"セクションへ移動",onpage:"このページ",back:"ページ上部へ",prev:"前へ",next:"次へ",start:"最初に戻る"},status:"Medical Excellence operating model",nav:["Excellenceの役割","5つの機能","Excellence workflow","実例","測定と改善"],hero:{a:"AIは実行を加速します。",b:"Medical Excellenceは品質を再現可能にします。",lead:"Medical Excellenceは人、プロセス、エビデンス、学習を結び、AI支援業務の科学的品質を機能横断で継続的に高めます。",rule:"AIがタスクを実行し、Medical Excellenceが標準を設計し、チームを支援し、品質を校正し、学習ループを強化します。"},role:{h:"Excellenceの役割は、良い仕事を再現可能にすること",take:"Excellenceは各機能の意思決定を代行せず、チームが安定した品質を大規模に生み出す共通システムを作ります。",items:[["定義","共通方法、品質基準、テンプレート、期待出力を設定する。"],["支援","実際のwork journeyに沿ったツール、スキル、coachingを提供する。"],["校正","出力を比較し、判断を揃え、繰り返す品質gapを特定する。"],["改善","修正、例外、結果をより良い標準と能力に変える。"]]},functions:{h:"Excellenceは各機能を異なる形で支援します",take:"共通システムは一貫させ、科学的判断と意思決定は各機能が保持します。",items:[["MSL","note-to-insight標準、insight calibration、coachingを強化する。"],["TA Lead","insight synthesis、優先順位基準、一貫した戦略策定を支援する。"],["Medical Content","evidence-to-story構造、追跡可能性、review品質を標準化する。"],["Patient Affairs","patient insightsを構造化し、測定可能な患者価値につなげる。"],["Medical Excellence","共通方法、能力構築、指標、機能横断学習を担う。"]]},workflow:{h:"一つのExcellence workflowがAI出力を学習に変えます",take:"専門タスクが異なっても、すべてのjourneyで同じ改善ループを使います。",steps:[["成功を設定","目的と期待品質"],["入力を標準化","必須項目と情報源構造"],["AIが支援","構造化、分析、草案"],["専門家が校正","意味と品質を確認"],["学習と改善","方法、ツール、スキルを更新"]]},caseStudy:{h:"実例：field conversationから戦略的優先事項へ",take:"Medicalの意思決定は各機能が行い、Excellenceは仕事の方法と学習を改善します。",steps:[["MSLが記録","Field interaction"],["AIが構造化","mVOC草案"],["MSLが校正","Signalとmeaning"],["TA Leadが統合","テーマと優先事項"],["TA Leadが決定","Ownerと次の行動"]],outcomeLabel:"Excellenceの貢献",outcome:"修正パターンを捉え、template、prompt、coaching、quality criteriaを更新して次のサイクルを改善します。"},measure:{h:"システムが改善しているかを測定します",take:"成功はAI outputの数ではなく、品質、学習速度、実行の一貫性です。",items:[["品質","First-pass acceptance、修正パターン、追跡可能性。"],["効率","Cycle timeと回避可能なrework。"],["一貫性","チームとjourney間での共通品質基準の利用。"],["学習","修正がテンプレート、ツール、coaching、skillsをどう改善したか。"]],actionTitle:"Excellence pilotを一つ開始",action:"高頻度のjourneyを一つ選び、function ownerとMedical Excellence partnerを一人ずつ指定します。baselineを記録してworkflowを実行し、4週間後に4指標をレビューします。"},footer:"Version 3.0 · 2026-08-24 · オフライン単一HTML · Internal Medical Excellence discussion draft。"},
      ko:{title:"AI × Medical Excellence | 운영 모델",desc:"Medical Excellence가 AI 지원 업무를 일관되고 측정 가능하며 지속적으로 개선되게 하는 방법입니다.",ui:{language:"언어",changed:"한국어로 전환했습니다",print:"인쇄 / PDF 저장",jump:"섹션으로 이동",onpage:"페이지 목차",back:"맨 위로",prev:"이전",next:"다음",start:"처음으로"},status:"Medical Excellence operating model",nav:["Excellence 역할","5개 기능","Excellence workflow","실제 사례","측정과 개선"],hero:{a:"AI는 실행을 가속합니다.",b:"Medical Excellence는 품질을 반복 가능하게 만듭니다.",lead:"Medical Excellence는 사람, 프로세스, 근거와 학습을 연결해 AI 지원 업무의 과학적 품질을 기능 전반에서 지속적으로 높입니다.",rule:"AI가 작업을 수행하고 Medical Excellence가 표준을 설계하며 팀을 지원하고 품질을 보정하며 학습 루프를 강화합니다."},role:{h:"Excellence의 역할은 좋은 업무를 반복 가능하게 만드는 것입니다",take:"Excellence는 기능의 결정을 대신하지 않습니다. 팀이 안정적인 품질을 확장할 수 있는 공통 시스템을 만듭니다.",items:[["정의","공통 방법, 품질 기준, 템플릿과 기대 출력을 설정합니다."],["지원","실제 work journey에 맞는 도구, skills와 coaching을 제공합니다."],["보정","출력을 비교하고 판단을 정렬하며 반복되는 품질 gap을 찾습니다."],["개선","수정, 예외와 결과를 더 나은 표준과 역량으로 전환합니다."]]},functions:{h:"Excellence는 기능마다 다른 방식으로 지원합니다",take:"공통 시스템은 일관되게 유지하고 과학적 판단과 결정은 각 기능이 담당합니다.",items:[["MSL","note-to-insight 표준, insight calibration과 coaching을 강화합니다."],["TA Lead","insight synthesis, 우선순위 기준과 일관된 전략 개발을 지원합니다."],["Medical Content","evidence-to-story 구조, 추적성과 review 품질을 표준화합니다."],["Patient Affairs","patient insights를 구조화하고 측정 가능한 환자 가치와 연결합니다."],["Medical Excellence","공통 방법, 역량 구축, 지표와 기능 간 학습을 담당합니다."]]},workflow:{h:"하나의 Excellence workflow가 AI 출력을 학습으로 전환합니다",take:"전문 업무가 달라도 모든 journey에서 같은 개선 루프를 사용합니다.",steps:[["성공 정의","목적과 기대 품질"],["입력 표준화","필수 항목과 출처 구조"],["AI 지원","구조화, 분석 또는 초안"],["전문가 보정","의미와 품질 확인"],["학습과 개선","방법, 도구와 skills 업데이트"]]},caseStudy:{h:"사례: field conversation에서 전략 우선순위까지",take:"Medical 결정은 기능이 담당하고 Excellence는 업무 방식과 학습을 개선합니다.",steps:[["MSL 기록","Field interaction"],["AI 구조화","mVOC 초안"],["MSL 보정","Signal과 meaning"],["TA Lead 종합","주제와 우선순위"],["TA Lead 결정","Owner와 다음 행동"]],outcomeLabel:"Excellence 기여",outcome:"수정 패턴을 수집하고 template, prompt, coaching과 quality criteria를 업데이트해 다음 주기를 개선합니다."},measure:{h:"시스템이 개선되는지 측정합니다",take:"성공은 AI output 수가 아니라 더 나은 품질, 더 빠른 학습과 더 일관된 실행입니다.",items:[["품질","First-pass acceptance, 수정 패턴과 추적성."],["효율","Cycle time과 피할 수 있는 rework."],["일관성","팀과 journey에서 같은 품질 기준을 사용하는 정도."],["학습","수정이 template, 도구, coaching과 skills를 개선하는 방식."]],actionTitle:"Excellence pilot 하나 시작",action:"빈도가 높은 journey 하나를 선택하고 function owner와 Medical Excellence partner를 한 명씩 지정합니다. baseline을 기록하고 workflow를 실행한 뒤 4주 후 네 가지 지표를 검토합니다."},footer:"Version 3.0 · 2026-08-24 · 오프라인 단일 HTML · Internal Medical Excellence discussion draft."},
      es:{title:"AI × Medical Excellence | Modelo operativo",desc:"Cómo Medical Excellence hace que el trabajo con IA sea coherente, medible y continuamente mejor en Medical Affairs.",ui:{language:"Idioma",changed:"Idioma cambiado a español",print:"Imprimir / guardar PDF",jump:"Ir a la sección",onpage:"En esta página",back:"Volver arriba",prev:"Anterior",next:"Siguiente",start:"Volver al inicio"},status:"Medical Excellence operating model",nav:["Rol de Excellence","Cinco funciones","Excellence workflow","Ejemplo práctico","Medir y mejorar"],hero:{a:"La IA acelera la ejecución.",b:"Medical Excellence hace que la calidad sea repetible.",lead:"Medical Excellence conecta personas, procesos, evidencia y aprendizaje para mejorar de forma coherente la calidad científica del trabajo apoyado por IA.",rule:"La IA realiza la tarea. Medical Excellence diseña el estándar, capacita al equipo, calibra la calidad y refuerza el ciclo de aprendizaje."},role:{h:"El rol de Excellence es hacer repetible el buen trabajo",take:"Excellence no sustituye las decisiones de las funciones. Crea el sistema común que ayuda a mantener una calidad fiable a escala.",items:[["Definir","Establecer métodos comunes, criterios de calidad, plantillas y resultados esperados."],["Capacitar","Crear herramientas, habilidades y coaching sobre work journeys reales."],["Calibrar","Comparar resultados, alinear criterios e identificar gaps de calidad recurrentes."],["Mejorar","Convertir cambios, excepciones y resultados en mejores estándares y capacidades."]]},functions:{h:"Excellence apoya cada función de forma diferente",take:"El sistema común se mantiene coherente; cada función conserva su juicio científico y sus decisiones.",items:[["MSL","Reforzar estándares de note-to-insight, insight calibration y coaching."],["TA Lead","Apoyar insight synthesis, criterios de priorización y desarrollo estratégico coherente."],["Medical Content","Estandarizar la estructura evidence-to-story, la trazabilidad y la calidad de review."],["Patient Affairs","Estructurar patient insights y conectarlos con valor medible para pacientes."],["Medical Excellence","Gestionar métodos comunes, desarrollo de capacidades, métricas y aprendizaje transversal."]]},workflow:{h:"Un Excellence workflow convierte la salida de IA en aprendizaje",take:"Cada journey utiliza el mismo ciclo de mejora, aunque la tarea profesional sea diferente.",steps:[["Definir éxito","Propósito y calidad esperada"],["Estandarizar entradas","Campos requeridos y estructura de fuentes"],["IA apoya","Estructurar, analizar o redactar"],["Experto calibra","Confirmar significado y calidad"],["Aprender y mejorar","Actualizar métodos, herramientas y habilidades"]]},caseStudy:{h:"Ejemplo: de field conversation a prioridad estratégica",take:"La función toma la decisión Medical. Excellence mejora la forma de trabajar y aprender.",steps:[["MSL registra","Field interaction"],["IA estructura","Borrador mVOC"],["MSL calibra","Signal y meaning"],["TA Lead sintetiza","Tema y prioridad"],["TA Lead decide","Owner y siguiente acción"]],outcomeLabel:"Contribución de Excellence",outcome:"Capturar patrones de corrección y actualizar template, prompt, coaching y quality criteria para el siguiente ciclo."},measure:{h:"Medir si el sistema está mejorando",take:"El éxito no es el número de AI outputs, sino una mejor calidad, aprendizaje más rápido y ejecución más coherente.",items:[["Calidad","First-pass acceptance, patrones de corrección y trazabilidad."],["Eficiencia","Cycle time y rework evitable."],["Coherencia","Uso del mismo estándar de calidad entre equipos y journeys."],["Aprendizaje","Cómo los cambios mejoran plantillas, herramientas, coaching y skills."]],actionTitle:"Iniciar un Excellence pilot",action:"Elegir un journey frecuente. Asignar un function owner y un Medical Excellence partner. Registrar el baseline, ejecutar el workflow y revisar las cuatro medidas después de cuatro semanas."},footer:"Versión 3.0 · 24-08-2026 · HTML único sin conexión       it:{title:"AI × Medical Excellence | Modello operativo",desc:"Come Medical Excellence rende il lavoro con IA coerente, misurabile e in continuo miglioramento in Medical Affairs.",ui:{language:"Lingua",changed:"Lingua impostata su italiano",print:"Stampa / salva PDF",jump:"Vai alla sezione",onpage:"In questa pagina",back:"Torna in alto",prev:"Precedente",next:"Successiva",start:"Torna all’inizio"},status:"Medical Excellence operating model",nav:["Ruolo di Excellence","Cinque funzioni","Excellence workflow","Esempio pratico","Misurare e migliorare"],hero:{a:"L’IA accelera l’esecuzione.",b:"Medical Excellence rende la qualità ripetibile.",lead:"Medical Excellence collega persone, processi, evidenze e apprendimento per migliorare in modo coerente la qualità scientifica del lavoro supportato dall’IA.",rule:"L’IA svolge il compito. Medical Excellence progetta lo standard, abilita il team, calibra la qualità e rafforza il ciclo di apprendimento."},role:{h:"Il ruolo di Excellence è rendere ripetibile il buon lavoro",take:"Excellence non sostituisce le decisioni delle funzioni. Crea il sistema comune che aiuta i team a produrre qualità affidabile su scala.",items:[["Definire","Stabilire metodi comuni, criteri di qualità, template e output attesi."],["Abilitare","Creare strumenti, skills e coaching intorno a work journey reali."],["Calibrare","Confrontare output, allineare giudizi e identificare gap di qualità ricorrenti."],["Migliorare","Trasformare modifiche, eccezioni e risultati in standard e capacità migliori."]]},functions:{h:"Excellence supporta ogni funzione in modo diverso",take:"Il sistema comune resta coerente; ogni funzione mantiene il proprio giudizio scientifico e le decisioni.",items:[["MSL","Rafforzare standard note-to-insight, insight calibration e coaching."],["TA Lead","Supportare insight synthesis, criteri di priorità e sviluppo strategico coerente."],["Medical Content","Standardizzare struttura evidence-to-story, tracciabilità e qualità di review."]     const app=document.getElementById('app'),language=document.getElementById('language'),languageLabel=document.getElementById('language-label'),languageStatus=document.getElementById('language-status'),printButton=document.getElementById('print-page'),meta=document.querySelector('meta[name="description"]'),suiteTabs=document.getElementById('suite-tabs'),portalHome=document.getElementById('portal-home'),portalWorkflow=document.getElementById('portal-workflow'),portalPatient=document.getElementById('portal-patient'),portalTa=document.getElementById('portal-ta'),portalMm=document.getElementById('portal-mm'),portalKnowledge=document.getElementById('portal-knowledge'),portalMvoc=document.getElementById('portal-mvoc'),portalReference=document.getElementById('portal-reference');

    function render(locale,announce=true){const t=copy[locale]||copy.en,p=portalCopy[locale]||portalCopy.en;document.documentElement.lang=t.contentLang||locale;document.title=t.title;meta.content=t.desc;languageLabel.textContent=t.ui.language;languageLabel.lang=locale;language.value=locale;printButton.textContent=t.ui.print;printButton.lang=locale;suiteTabs.setAttribute('aria-label',p.label);portalHome.textContent=p.home;portalWorkflow.textContent=p.workflow;portalPatient.textContent=p.patient;portalTa.textContent=p.ta;portalMm.textContent=p.mm;portalKnowledge.textContent=p.knowledge;portalMvoc.textContent=p.mvoc;portalReference.textContent=p.reference;app.innerHTML=page(t,locale);if(announce)languageStatus.textContent=t.ui.changed;try{localStorage.setItem('medai-language',locale);localStorage.setItem('me-excellence-language',locale)}catch(_){}const sections=[...document.querySelectorAll('main>section[id]')],links=[...document.querySelectorAll('.toc a')],select=document.getElementById('section-select'),progress=document.getElementById('progress'),back=document.getElementById('back');printButton.onclick=()=>window.print();select.addEventListener('change',e=>document.getElementById(e.target.value)?.scrollIntoView());const setCurrent=id=>{links.forEach(a=>a.getAttribute('href')===`#${id}`?a.setAttribute('aria-current','true'):a.removeAttribute('aria-current'));if([...select.options].some(o=>o.value===id))select.value=id};if(observer)observer.disconnect();observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(visible)setCurrent(visible.target.id)},{rootMargin:'-18% 0px -65% 0px',threshold:[0,.1,.3]});sections.forEach(s=>observer.observe(s));const onScroll=()=>{const height=document.documentElement.scrollHeight-innerHeight;progress.style.width=`${height>0?Math.min(100,Math.max(0,scrollY/height*100)):0}%`;back.classList.toggle('show',scrollY>650)};document.onscroll=onScroll;o
