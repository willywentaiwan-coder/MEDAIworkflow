  <noscript><main style="max-width:800px;margin:3rem auto;padding:1rem"><h1>Management Monitoring AI workflow</h1><p>Define target and risk → map controls → load the approved rule pack → define population and sample → test evidence → classify exceptions → human adjudication → action and CAPA → verify effectiveness → improve the next cycle.</p><p>AI identifies evidence patterns and drafts working outputs. Management owns findings, risk decisions, corrective action and escalation.</p></main></noscript>

      en:{title:"Management Monitoring | AI workflow",desc:"A risk-based Management Monitoring AI workflow using a common engine, target-specific rule packs and human management decisions.",language:"Language",changed:"Language changed to English",print:"Print / save PDF",onpage:"On this page",nav:["Meaning","Operating architecture","Detailed workflow","Ownership","Prompt library","Example & measures"],eyebrow:"Medical Governance operating workflow",heroA:"Monitor process health",heroB:"before risk becomes a finding.",lead:"Management Monitoring checks whether a function's own processes are followed, key controls operate effectively and identified gaps are corrected. AI makes evidence review faster; management remains accountable.",rule:"Common engine for method. Target-specific rule pack for requirements. Human management for findings, risk decisions, CAPA and escalation.",roleH:"MM is a first-line management feedback loop",roleTake:"It is not case approval, a substitute for Independent Business Monitoring, or an automated audit. It gives process management evidence that controls continue to work across a defined population.",principles:[["Risk-based","Start from the process risk and the control that should prevent, detect or correct it."],["Evidence-backed","Every exception links to a source record, control question and rule version."],["Management-owned","The process or control owner confirms meaning, severity, action and escalation."],["Closed-loop","Monitoring is complete only when actions are implemented and effectiveness is verified."]],architectureH:"One reusable engine, many controlled rule packs",architectureTake:"Keep the monitoring method stable while loading only the approved requirements, evidence and thresholds for the selected target.",architecture:[["Common MM Engine","Defines scope, evidence discipline, exception categories, uncertainty and the human decision gates."],["Target Rule Pack","Holds control questions, applicability, evidence, pass conditions, exception conditions and source versions."],["Output Modules","Produces the sample log, exception register, finding draft, CAPA tracker, dashboard and management summary."]],workflowH:"Ten gates from monitoring scope to control improvement",workflowTake:"Each step produces a durable record. The AI output is working evidence, not a final compliance determination.",labels:["Question","AI assists","Management decides","Output","Gate"],steps:[

        ["Map risk, process and controls","What could fail, which control should address it and who owns that control?","Draft the risk–process–control map and identify missing control descriptions.","Confirm risk statement, key controls, control owner and expected evidence.","Approved control map.","Every test is connected to an identified risk and control."],

        ["Define population and safe data boundary","What is the complete population and which data may be used?","Reconcile records, detect duplicates, missing metadata and possible restricted fields.","Confirm population completeness, exclusions, data permissions and de-identification needs.","Population register and data boundary.","No unapproved personal or restricted information enters the AI workflow."],

eTake:"Illustrative only. The deployed rule pack must be built from the currently approved internal standard and local requirements.",example:["Management defines the period, complete engagement population and risk questions to be monitored.","The approved External Expert rule pack specifies applicable control questions and required evidence without placing the entire policy inside the prompt.","AI proposes a combined random and risk-targeted sample, then cites evidence for each test and flags missing, inconsistent or late records.","Management reviews context, determines whether each item is an exception or insufficient evidence, and confirms any finding and root cause.","Actions are assigned and later re-tested. The next MM cycle changes only when effectiveness evidence supports the adjustment."],measureH:"Measure control health, not AI activity",measureTake:"The number of AI checks is not evidence of an effective MM program. Measures should show coverage, decision quality, remediation and reduced repeat risk.",metrics:[["Coverage","Population reconciliation, approved sample completion and control coverage."],["Evidence quality","Traceable citations, missing-evidence rate and human correction patterns."],["Exception quality","Confirmed versus dismissed potential exceptions, recurring themes and severity mix."],["Closure quality","On-time actions, overdue risk, effectiveness verification and repeat findings."]],action:"Pilot one high-frequency MM target. Freeze the rule-pack version, use a small approved population, compare AI-assisted and current review, calibrate false positives and omissions, then decide whether to scale.",sourceH:"Public framework references",sources:[["GSK Risk Management and Internal Control Policy","https://www.gsk.com/media/g0ub104b/risk-management-and-internal-control-policy.pdf"],["GSK Code of Practice for promotion and scientific engagement","https://us.gsk.com/media/5193/code-of-practice.pdf"]],sourceNote:"Exact internal policies, SOPs,
